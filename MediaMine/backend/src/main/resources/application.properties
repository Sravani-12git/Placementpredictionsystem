server.port=8080

# Application Name
spring.application.name=MediaMine

# Database Configuration: PostgreSQL (Default)
# Set these properties to your PostgreSQL database credentials:
spring.datasource.url=jdbc:postgresql://localhost:5432/mediamine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database Fallback (Enabled for standalone zero-config execution if PostgreSQL is offline)
# To use H2 in-memory mode, uncomment the following lines and comment out PostgreSQL lines above:
# spring.datasource.url=jdbc:h2:mem:mediamine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CORS & REST Settings
spring.jackson.serialization.indent_output=true
